  <!-- transports -->
  <g><rect x="745" y="245" width="230" height="175" class="box proto"/><text x="770" y="280" class="h">HTTP</text><text x="770" y="310" class="t">ESP32 :80 / PetDesktop :47831</text><text x="770" y="340" class="tiny">POST /api/agent?state=...</text><text x="770" y="360" class="tiny">POST /api/cmd · Bearer Token</text><text x="770" y="385" class="tiny">POST /api/v1/agents/{id}/state</text><text x="770" y="405" class="tiny">POST /api/v1/agents/{id}/message</text></g>
  <g><rect x="745" y="455" width="230" height="125" class="box proto"/><text x="770" y="490" class="h">UDP :8888</text><text x="770" y="520" class="t">文本：agent busy\n</text><text x="770" y="550" class="tiny">auth &lt;token&gt; &lt;command&gt;</text></g>
  <g><rect x="745" y="615" width="230" height="125" class="box proto"/><text x="770" y="650" class="h">USB CDC Serial</text><text x="770" y="680" class="t">文本命令 + 换行</text><text x="770" y="710" class="t">115200 baud</text></g>
  <g><rect x="745" y="785" width="230" height="145" class="box proto" stroke-dasharray="8 6"/><text x="770" y="820" class="h">UDP 广播发现</text><text x="770" y="850" class="t">discover / ping / who</text><text x="770" y="877" class="t">255.255.255.255:8888</text><text x="770" y="905" class="tiny">返回 IP / HTTP 端口 / caps JSON</text></g>
  <path d="M670 1210 C720 1210 705 332 745 332" class="amber"/><path d="M670 1240 C720 1240 705 517 745 517" class="amber"/><path d="M670 1270 C720 1270 705 677 745 677" class="amber"/>

  <!-- PetDesktop -->
  <g><rect x="1050" y="205" width="380" height="530" class="box desk"/><text x="1080" y="245" class="h">PetDesktop · Tauri 2 / Rust / React</text>
    <rect x="1080" y="275" width="320" height="78" class="box desk"/><text x="1100" y="307" class="h">HTTP / UDP 兼容接入</text><text x="1100" y="334" class="tiny">/api/agent · /api/cmd · /api/state</text>
    <rect x="1080" y="370" width="320" height="82" class="box desk"/><text x="1100" y="402" class="h">多 Agent API</text><text x="1100" y="429" class="tiny">register · heartbeat 10s · state · message</text>
    <rect x="1080" y="470" width="320" height="70" class="box desk"/><text x="1100" y="500" class="h">气泡消息队列</text><text x="1100" y="527" class="tiny">per-agent VecDeque(20) · 去重 · 优先级 · TTL</text>
    <rect x="1080" y="560" width="320" height="100" class="box desk"/><text x="1100" y="592" class="h">AppCore 状态仲裁</text><text x="1100" y="620" class="t">锁定优先 → 状态优先级</text><text x="1100" y="644" class="tiny">error &gt; waiting &gt; upgrade &gt; busy ...</text>
    <rect x="1080" y="680" width="145" height="64" class="box out"/><text x="1097" y="710" class="h">React 管理 App</text><text x="1097" y="732" class="tiny">snapshot-changed</text>
    <rect x="1255" y="680" width="145" height="64" class="box out"/><text x="1275" y="708" class="h">透明桌宠</text><text x="1275" y="730" class="tiny">动画 + 气泡</text>
  </g>
  <g><rect x="1050" y="770" width="380" height="150" class="box desk"/><text x="1080" y="810" class="h">Hardware Worker</text><text x="1080" y="842" class="t">mpsc 队列 · effectiveState</text><text x="1080" y="870" class="t">HTTP / UDP / Serial 桥接</text><text x="1080" y="896" class="tiny">透传：rgb / effect / brightness / speed / power / reset</text></g>
