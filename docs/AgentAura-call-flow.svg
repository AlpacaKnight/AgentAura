  <path d="M330 262 H400" class="line"/><path d="M330 412 H400" class="line"/><path d="M330 552 H400" class="line"/><path d="M330 692 H400" class="line"/><path d="M330 832 H400" class="line"/><path d="M330 962 H400" class="line"/><path d="M330 1082 H400" class="line"/>
