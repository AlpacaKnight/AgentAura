    <rect x="1080" y="1030" width="320" height="45" class="box hw"/><text x="1100" y="1059" class="t">REST :80 · UDP :8888 · Serial · BLE · MQTT</text>
    <rect x="1080" y="1095" width="96" height="62" class="box hw"/><text x="1092" y="1123" class="h">Command</text><text x="1092" y="1145" class="tiny">Parser</text>
    <rect x="1192" y="1095" width="96" height="62" class="box hw"/><text x="1204" y="1123" class="h">Effect</text><text x="1204" y="1145" class="tiny">Engine</text>
    <rect x="1304" y="1095" width="96" height="62" class="box hw"/><text x="1317" y="1123" class="h">FastLED</text><text x="1317" y="1145" class="tiny">Driver</text>
  </g>
  <path d="M975 362 C1010 362 1000 1053 1080 1053" class="amber"/><path d="M975 517 C1015 517 1000 1053 1080 1053" class="amber"/><path d="M975 677 C1020 677 1000 1053 1080 1053" class="amber"/><text x="986" y="957" class="tiny">直连路线</text>
