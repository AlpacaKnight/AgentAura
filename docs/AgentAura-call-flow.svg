<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1500" viewBox="0 0 1920 1500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10192b"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7dd3fc"/></marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#fbbf24"/></marker>
    <style>
      .title{font:700 40px 'Microsoft YaHei',sans-serif;fill:#f8fafc}.sub{font:18px 'Microsoft YaHei',sans-serif;fill:#94a3b8}
      .lane{fill:#0b1526;stroke:#26364f;stroke-width:2}.laneTitle{font:700 20px 'Microsoft YaHei',sans-serif;fill:#cbd5e1}
      .box{rx:14;stroke-width:2}.agent{fill:#201938;stroke:#a78bfa}.proto{fill:#33270f;stroke:#fbbf24}.desk{fill:#0c302d;stroke:#2dd4bf}.hw{fill:#39191d;stroke:#fb7185}.out{fill:#102d46;stroke:#38bdf8}
      .h{font:700 17px 'Microsoft YaHei',sans-serif;fill:#fff}.t{font:14px 'Microsoft YaHei',sans-serif;fill:#cbd5e1}.tiny{font:12px 'Microsoft YaHei',sans-serif;fill:#94a3b8}
      .line{fill:none;stroke:#7dd3fc;stroke-width:2.4;marker-end:url(#arrow)}.amber{fill:none;stroke:#fbbf24;stroke-width:2.6;marker-end:url(#arrowAmber)}.dash{stroke-dasharray:8 7}
    </style>
  </defs>
  <rect width="1920" height="1500" fill="url(#bg)"/>
  <text x="60" y="68" class="title">AgentAura 完整调用流程</text>
  <text x="60" y="101" class="sub">Agent / IDE 事件 → 插件状态映射 + 气泡摘要 → 多协议传输 → PetDesktop 仲裁 / 气泡队列 / ESP32 固件 → 桌宠动画与 WS2812B 灯效</text>

  <!-- lanes -->
  <rect x="45" y="135" width="310" height="1240" rx="20" class="lane"/><text x="70" y="175" class="laneTitle">① Agent / IDE 事件源</text>
  <rect x="375" y="135" width="320" height="1240" rx="20" class="lane"/><text x="400" y="175" class="laneTitle">② AgentAura 插件层</text>
  <rect x="715" y="135" width="290" height="1240" rx="20" class="lane"/><text x="740" y="175" class="laneTitle">③ 调用方式</text>
  <rect x="1025" y="135" width="430" height="1240" rx="20" class="lane"/><text x="1050" y="175" class="laneTitle">④ App / 固件处理</text>
  <rect x="1475" y="135" width="400" height="1240" rx="20" class="lane"/><text x="1500" y="175" class="laneTitle">⑤ 输出 / 外部入口</text>

  <!-- sources -->
  <g><rect x="70" y="210" width="260" height="105" class="box agent"/><text x="90" y="242" class="h">Codex CLI Hooks</text><text x="90" y="270" class="t">SessionStart · PreToolUse</text><text x="90" y="294" class="t">Permission · PostToolUse</text></g>
  <g><rect x="70" y="335" width="260" height="105" class="box agent"/><text x="90" y="367" class="h">Claude Code Hooks</text><text x="90" y="395" class="t">Marketplace + hooks.json</text><text x="90" y="419" class="t">会话 · 工具 · 审批 · 停止</text></g>
  <g><rect x="70" y="460" width="260" height="105" class="box agent"/><text x="90" y="492" class="h">Kimi Code Hooks</text><text x="90" y="520" class="t">config.toml [[hooks]]</text><text x="90" y="544" class="t">SessionStart · 工具 · 停止等</text></g>
  <g><rect x="70" y="585" width="260" height="105" class="box agent"/><text x="90" y="617" class="h">ZCode Hooks</text><text x="90" y="645" class="t">插件内 hooks.json</text><text x="90" y="669" class="t">SessionStart · 工具 · 停止等</text></g>
  <g><rect x="70" y="710" width="260" height="105" class="box agent"/><text x="90" y="742" class="h">Qwen Code CLI Hooks</text><text x="90" y="770" class="t">扩展系统 hooks</text><text x="90" y="794" class="t">会话 · 工具 · 审批事件</text></g>
  <g><rect x="70" y="835" width="260" height="105" class="box agent"/><text x="90" y="867" class="h">VS Code Copilot</text><text x="90" y="895" class="t">Chat transcript</text><text x="90" y="919" class="t">终端 / 会话观察</text></g>
  <g><rect x="70" y="960" width="260" height="105" class="box agent"/><text x="90" y="992" class="h">QwenPaw</text><text x="90" y="1020" class="t">AgentRunner</text><text x="90" y="1044" class="t">ApprovalService</text></g>
  <g><rect x="70" y="1110" width="260" height="120" class="box out"/><text x="90" y="1144" class="h">用户 / 管理界面</text><text x="90" y="1174" class="t">手动状态与灯效</text><text x="90" y="1200" class="t">连接配置 / Agent 锁定</text></g>

  <!-- plugins -->
  <g><rect x="400" y="210" width="270" height="125" class="box agent"/><text x="420" y="242" class="h">agent-aura-codex</text><text x="420" y="272" class="t">hooks.ts → DeviceClient</text><text x="420" y="296" class="tiny">buildCodexMessage → sendMessage</text><text x="420" y="318" class="tiny">idle-fallback 定时器</text></g>
  <g><rect x="400" y="350" width="270" height="125" class="box agent"/><text x="420" y="382" class="h">agent-aura-claude</text><text x="420" y="412" class="t">hooks.ts → RingLightClient</text><text x="420" y="436" class="tiny">buildClaudeMessage → sendMessage</text><text x="420" y="458" class="tiny">/agent-aura-claude:aura</text></g>
  <g><rect x="400" y="490" width="270" height="125" class="box agent"/><text x="420" y="522" class="h">agent-aura-kimi-code</text><text x="420" y="552" class="t">hooks.ts → DeviceClient</text><text x="420" y="576" class="tiny">buildKimiMessage → sendMessage</text></g>
  <g><rect x="400" y="630" width="270" height="125" class="box agent"/><text x="420" y="662" class="h">agent-aura-zcode</text><text x="420" y="692" class="t">hooks → RingLightClient</text><text x="420" y="716" class="tiny">buildZcodeMessage → sendMessage</text><text x="420" y="738" class="tiny">HTTP/UDP/Serial 桥接</text></g>
  <g><rect x="400" y="770" width="270" height="125" class="box agent"/><text x="420" y="802" class="h">agent-aura-qwencode</text><text x="420" y="832" class="t">hooks.ts → DeviceClient</text><text x="420" y="856" class="tiny">buildQwenMessage → sendMessage</text><text x="420" y="878" class="tiny">含 Qwen Code 扩展安装</text></g>
  <g><rect x="400" y="910" width="270" height="105" class="box agent"/><text x="420" y="942" class="h">agent-aura-copilot</text><text x="420" y="972" class="t">Watcher → StateMapper</text><text x="420" y="996" class="tiny">→ DeviceClient</text></g>
  <g><rect x="400" y="1030" width="270" height="105" class="box agent"/><text x="420" y="1062" class="h">qwenpaw-plugin</text><text x="420" y="1092" class="t">runner / approval → mapper</text><text x="420" y="1116" class="tiny">→ client.py</text></g>
  <g filter="url(#glow)"><rect x="400" y="1160" width="270" height="190" class="box desk"/><text x="420" y="1194" class="h">统一状态映射</text><text x="420" y="1228" class="t">init · running · busy</text><text x="420" y="1256" class="t">waiting · idle · error</text><text x="420" y="1284" class="t">offline · upgrade</text><text x="420" y="1320" class="tiny">去抖 / 失败冷却 / fire-and-forget</text></g>

