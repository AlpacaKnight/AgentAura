  <g filter="url(#glow)"><rect x="1510" y="250" width="330" height="150" class="box out"/><text x="1540" y="290" class="h">桌宠动画 + 气泡输出</text><text x="1540" y="322" class="t">effectiveState → spritesheet</text><text x="1540" y="348" class="t">PetBubble 状态模板 + 事件摘要</text><text x="1540" y="376" class="tiny">闲逛 · 置顶 · 鼠标穿透</text></g>
  <g filter="url(#glow)"><rect x="1510" y="965" width="330" height="150" class="box out"/><text x="1540" y="1009" class="h">WS2812B 环形灯</text><text x="1540" y="1043" class="t">颜色 · 呼吸 · 跑马 · 闪烁</text><text x="1540" y="1075" class="tiny">物理状态可视化输出</text></g>
  <g><rect x="1510" y="500" width="330" height="250" class="box proto" stroke-dasharray="8 6"/><text x="1540" y="540" class="h">ESP32 额外入口</text><text x="1540" y="580" class="t">浏览器 Web 控制页 / AP 配网</text><text x="1540" y="620" class="t">BLE App / GATT Client</text><text x="1540" y="660" class="t">MQTT Broker / 自动化平台</text><text x="1540" y="705" class="tiny">这些路径不经过 Agent 插件</text></g>
