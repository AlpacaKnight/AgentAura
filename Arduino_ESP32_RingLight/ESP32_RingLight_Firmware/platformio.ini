; ============================================================
;  ESP32 圆环灯板全能固件 v1.0
;  目标硬件: ESP32-C3 + WS2812B 圆环 24 灯 (DIN = GPIO3)
; ============================================================

[platformio]
default_envs = esp32c3

[env:esp32c3]
platform        = espressif32@^6.7.0
board           = esp32-c3-devkitm-1
framework       = arduino

; --- 4MB Flash 用 huge_app 分区, app0 ~3.2MB (无 OTA, 换取最大可用空间) ---
board_build.partitions = huge_app.csv
board_build.filesystem = none

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; NimBLE-Arduino 自带 NimBLE 控制器, 不依赖 SDK 的 Bluedroid BT 库
  ; 不要再强制 -DCONFIG_BT_*=1, 否则与 sdkconfig 冲突导致运行时崩溃

lib_deps =
  fastled/FastLED @ ^3.7.0
  bblanchon/ArduinoJson @ ^7.1.0
  knolleary/PubSubClient @ ^2.8.0
  h2zero/NimBLE-Arduino @ ^2.3.1

lib_ldf_mode = deep+
