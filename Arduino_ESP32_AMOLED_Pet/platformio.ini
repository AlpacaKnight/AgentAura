  https://github.com/moononournation/Arduino_GFX.git#v1.6.6
  ; ---- IO 闂備礁婀遍。浠嬪疾濞戙垺鍎?(lzw655/ESP32_IO_Expander 闂?PlatformIO 婵犵數鍋涢ˇ顓㈠礉瀹€鍕埞濞寸姴顑呯憴? ----
  ; ---- 闂備焦鎮堕崕鏌ュ磿閹惰姤鍤嬪ù鐓庣摠閸嬧晝鈧厜鍋撻柛鏇ㄥ墯閵?----
  lvgl/lvgl @ ^8.4.0
  ; ---- 闂傚倷绶￠崑鍛存儗椤旂晫鈹?----
  knolleary/PubSubClient @ ^2.8.0
  h2zero/NimBLE-Arduino @ ^2.3.1
  ; ---- 闂備焦鐪归崹褰掓倶濮樿精濮虫い鏂垮⒔娑撳秹鏌ㄥ☉妯侯仾闁?(闂備胶鍎甸弲娑㈡偤閵娧勬殰閻庢稒顭囬々?GitHub 闂備胶鎳撻崲鏌ニ囬婵勪汗闁搞儺鍓氶弲顒勬倵濞戞碍顥istry 缂傚倸鍊搁崐褰掑箰閹间焦鍋ら柕濞炬櫅鐎氬顭块懜闈涘闁挎稒鐗曡灋? ----
