[platformio]
default_envs = esp32c6

[env:esp32c6]
platform        = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board           = esp32c6_amoled_1_8
board_build.mcu = esp32c6
board_build.f_cpu = 160000000L
board_build.flash_mode = qio
board_build.f_flash = 80000000L
framework       = arduino

; 16MB Flash 闂備礁鎲＄敮鎺懳涘Δ鍐х剨? 3MB APP + ~13MB SPIFFS (闂備焦鎮堕崕杈ㄦ櫠閼恒儲娅?闂佽瀛╃粙鎺楀Φ閻愮數绀?闂傚倸鍊搁敃銊モ枍閺囥垹鐤?
board_build.partitions = partitions_16MB.csv
board_build.arduino.upstream_packages = no

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCONFIG_LV_MEM_CUSTOM=1
  -DCONFIG_I2C_ENABLE_I2C_MASTER=0
  -DCONFIG_I2C_ENABLE_I2C0=0
  -DCONFIG_I2C_ENABLE_I2C1=0
  -DCONFIG_I2C_ISR_IRAM_SAFE=0
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_LVGL_H_INCLUDE_SIMPLE
  -DLCD_DRIVER_SH8601
  -I src
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Network/src


lib_deps =
  ; ---- 闂備胶纭堕弲鐐测枍閿濆鈧線宕ㄩ钘夊妳?----
  bblanchon/ArduinoJson @ ^7.1.0
